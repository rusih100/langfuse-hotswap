[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "langfuse-hotswap"
dynamic = ["version"]
description = "LangChain chain whose model and parameters live in the Langfuse prompt config"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ruslan Glotov" }
]
keywords = ["langchain", "langfuse", "llm", "prompt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langfuse>=5,<6",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/rusih100/langfuse-hotswap"
Repository = "https://github.com/rusih100/langfuse-hotswap"
Issues = "https://github.com/rusih100/langfuse-hotswap/issues"
Releases = "https://github.com/rusih100/langfuse-hotswap/releases"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/langfuse_hotswap/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langfuse_hotswap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4
src = ["src", "tests"]
# Generated by hatch-vcs at build time.
extend-exclude = ["src/langfuse_hotswap/_version.py"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "I",
    "Q",
    "E",
    "W",
    "F",
    "UP",
    "C",
    "B",
    "S",
    "ISC",
    "ASYNC",
    "T20",
    "ANN",
    "TC",
    "PT",
    "RUF",
    "C90",
    "SIM",
    "A",
    "C4",
    "TID",
    "N",
]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["F401"]
"tests/**" = ["S101"]
# The Runnable interface names the argument ``input``.
"src/langfuse_hotswap/_runnable.py" = ["A002"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = false
suppress-none-returning = false
# Pass-through **kwargs for init_chat_model and the model methods are typed as Any.
allow-star-arg-any = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["langfuse_hotswap"]
lines-between-types = 1
order-by-type = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ty.environment]
python-version = "3.11"
