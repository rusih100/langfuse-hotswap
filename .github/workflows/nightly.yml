name: Nightly

# Runs the tests, the SDK contract tests among them, on the latest langfuse 4.x and 5.x releases.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langfuse-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langfuse: [">=4,<5", ">=5,<6"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv pip install --upgrade "langfuse${{ matrix.langfuse }}"
      - run: uv pip show langfuse
      - run: uv run pytest -q
