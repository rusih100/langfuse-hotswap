name: Nightly

# Runs the tests, the SDK contract tests among them, on the latest langfuse 4.x and 5.x releases.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langfuse-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langfuse: [">=4,<5", ">=5,<6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv pip install --upgrade "langfuse${{ matrix.langfuse }}"
      - run: uv pip show langfuse
      - run: uv run pytest -q
